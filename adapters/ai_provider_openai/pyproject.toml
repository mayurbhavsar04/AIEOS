[project]
name = "aieos-adapter-ai-provider-openai"
version = "0.0.0"
description = "Opt-in OpenAI provider adapter for the AIEOS AI Gateway."
requires-python = "==3.13.*"
dependencies = [
  "aieos-ai-gateway",
  "httpx==0.28.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aieos/adapters/ai_provider_openai"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.uv.sources]
aieos-ai-gateway = { workspace = true }
