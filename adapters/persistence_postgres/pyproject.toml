[project]
name = "aieos-adapter-persistence-postgres"
version = "0.0.0"
description = "AIEOS persistence postgres bootstrap package."
requires-python = "==3.13.*"
dependencies = [
  "aieos-contracts",
  "aieos-domain",
  "aieos-event-bus",
  "aieos-memory-service",
  "alembic==1.16.5",
  "asyncpg==0.30.0",
  "sqlalchemy[asyncio]==2.0.43",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aieos/adapters/persistence_postgres"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.uv.sources]
aieos-contracts = { workspace = true }
aieos-domain = { workspace = true }
aieos-event-bus = { workspace = true }
aieos-memory-service = { workspace = true }
