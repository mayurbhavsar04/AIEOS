name: Governed OpenAI conformance

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag, or commit SHA containing the provider adapter to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: governed-openai-conformance
  cancel-in-progress: false

jobs:
  live-openai:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: live-provider-validation
    env:
      AIEOS_AI_PROVIDER: openai
      AIEOS_RUN_LIVE_PROVIDER_TESTS: "1"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Check out target ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.target_ref }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check uv==0.8.14
      - name: Sync locked workspace
        run: uv sync --all-packages --all-groups --locked
      - name: Run tiny paid-provider conformance
        run: >-
          uv run pytest
          -o "addopts=-ra --strict-config --strict-markers"
          -m live_provider
          adapters/ai_provider_openai/tests/test_openai_live.py
