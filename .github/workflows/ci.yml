name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: aieos_test
          POSTGRES_USER: aieos
          POSTGRES_PASSWORD: aieos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aieos -d aieos_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      AIEOS_TEST_DATABASE_URL: postgresql+asyncpg://aieos:aieos_ci@localhost:5432/aieos_test
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check uv==0.8.14
      - name: Sync locked workspace
        run: uv sync --all-packages --all-groups --locked
      - name: Upgrade mandatory PostgreSQL test schema
        run: uv run alembic upgrade head
      - name: Validate workspace
        run: ./scripts/check
      - name: Require PostgreSQL durability suite
        run: uv run pytest -m postgres_required
